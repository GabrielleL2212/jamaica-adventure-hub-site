<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jamaica Adventure Hub | Book a Tour</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <nav class="navbar-custom">
        <a class="navbar-brand-custom" href="index.html">🇯🇲 Jamaica Adventure Hub</a>
        <div class="nav-links-custom">
            <a href="index.html">Home</a>
            <a href="explore.html">Explore Adventures</a>
            <a href="booking.html" class="active">Book a Tour</a>
        </div>
    </nav>

    <main class="main-container text-center">
        <header style="margin-bottom: 40px;">
            <h1 style="font-size: 36px; margin-bottom: 10px;">Secure Your Excursion</h1>
            <p style="color: #666;">Fill out the registration details below to reserve your spot.</p>
        </header>

        <div class="form-card">
            <form id="booking-form">
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" class="input-field" id="fullName" placeholder="Enter first and last name">
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" class="input-field" id="email" placeholder="name@example.com">
                </div>

                <div class="form-group">
                    <label for="adventureSelect">Select Your Adventure</label>
                    <select class="input-field" id="adventureSelect">
                        <option value="">-- Choose an Option --</option>
                        <option value="danns-river">Dunn's River Falls Tour</option>
                        <option value="blue-mountain">Blue Mountain Peak Hike</option>
                        <option value="seven-mile">Seven Mile Beach Relaxation</option>
                    </select>
                </div>

                <button type="submit" class="submit-btn">Complete Reservation</button>
            </form>
            
            <div id="success-alert" class="alert-box hidden">
                🎉 Your reservation request was submitted successfully!
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Jamaica Adventure Hub. All Rights Reserved.</p>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
