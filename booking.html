<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jamaica Adventure Hub | Book a Tour</title>
    <!-- Linking directly to your custom layout rules sheet -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- CUSTOM THEMED NAVIGATION BAR -->
    <nav class="navbar">
        <a class="navbar-brand" href="index.html">🇯🇲 Jamaica Adventure Hub</a>
        <div class="nav-links">
            <a class="nav-link" href="index.html">Home</a>
            <a class="nav-link" href="explore.html">Explore Adventures</a>
            <a class="nav-link active" href="booking.html">Book a Tour</a>
        </div>
    </nav>

    <!-- FORM INTERACTION CONTAINER -->
    <main class="container text-center">
        <header style="margin-bottom: 40px;">
            <h1 style="font-size: 36px; margin-bottom: 10px; font-weight: bold;">Secure Your Excursion</h1>
            <p class="text-muted">Fill out the registration details below to reserve your spot.</p>
        </header>

        <!-- FIXED FORM WRAPPER (ADDED THE FORM-CARD CLASS FOR CENTERED ALIGNMENT) -->
        <div class="form-card">
            <form id="booking-form">
                
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" class="form-control" id="fullName" placeholder="Enter first and last name">
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" class="form-control" id="email" placeholder="name@example.com">
                </div>

                <div class="form-group">
                    <label for="adventureSelect">Select Your Adventure</label>
                    <select class="form-select" id="adventureSelect">
                        <option value="">-- Choose an Option --</option>
                        <option value="danns-river">Dunn's River Falls Tour</option>
                        <option value="blue-mountain">Blue Mountain Peak Hike</option>
                        <option value="seven-mile">Seven Mile Beach Relaxation</option>
                        <!-- ADDED MARTHA BRAE OPTION HERE -->
                        <option value="martha-brae">Martha Brae River Rafting</option>
                    </select>
                </div>

                <button type="submit" class="btn-dark">Complete Reservation</button>
            </form>
            
            <!-- Dynamic Success Alert Container -->
            <div id="success-alert" class="alert-success hidden" role="alert">
                🎉 Your reservation request was submitted successfully!
            </div>
        </div>
    </main>

    <!-- FOOTER STRUCTURE -->
    <footer class="text-center">
        <p style="margin: 0;">&copy; 2026 Jamaica Adventure Hub. All Rights Reserved.</p>
    </footer>

    <!-- Core Javascript Code -->
    <script src="js/app.js"></script>
</body>
</html>
