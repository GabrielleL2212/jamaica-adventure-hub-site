<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jamaica Adventure Hub | Explore</title>
    <!-- Linking directly to your custom layout rules sheet -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- CLEAN, WIDE STUDENT NAVIGATION HEADER -->
    <nav class="navbar">
        <a class="navbar-brand" href="index.html">🇯🇲 Jamaica Adventure Hub</a>
        <div class="nav-links">
            <a class="nav-link" href="index.html">Home</a>
            <a class="nav-link active" href="explore.html">Explore Adventures</a>
            <a class="nav-link" href="booking.html">Book a Tour</a>
        </div>
    </nav>

    <!-- CONTENT DISPLAY MAIN CONTAINER -->
    <main class="container text-center">
        <header style="margin-bottom: 40px;">
            <h1 style="font-size: 38px; margin-bottom: 12px; font-weight: bold;">Choose Your Adventure</h1>
            <p class="text-muted">Filter smoothly through our hand-picked Jamaican excursions below.</p>
        </header>

        <!-- CATEGORY ACTION BUTTONS MATCHING YOUR JAVASCRIPT ARRAY CASING EXACTLY -->
        <section class="button-group">
            <button class="btn btn-custom active" data-category="all">Show All</button>
            <button class="btn btn-custom" data-category="Water">Waterfalls & Rivers</button>
            <button class="btn btn-custom" data-category="Mountain">Hiking & Mountains</button>
            <button class="btn btn-custom" data-category="Beach">Pristine Beaches</button>
        </section>

        <!-- HORIZONTALLY CENTERED ADVENTURE ROW GRID -->
        <section class="row" id="adventure-container">
            <div class="col-12 text-muted" style="padding: 40px 0;">
                <p>Loading epic Jamaican adventures...</p>
            </div>
        </section>
    </main>

    <!-- FOOTER STRUCTURE -->
    <footer class="text-center">
        <p style="margin: 0;">&copy; 2026 Jamaica Adventure Hub. All Rights Reserved.</p>
    </footer>

    <!-- Your Core Javascript Code -->
    <script src="js/app.js"></script>
</body>
</html>
