<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jamaica Adventure Hub | Explore</title>
    <!-- Official Bootstrap 5 Framework Layout Link Added Successfully -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    <!-- Custom theme rules sheet -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- BOOTSTRAP NAVIGATION INTERFACE -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">🇯🇲 Jamaica Adventure Hub</a>
            <div class="ms-auto">
                <div class="navbar-nav flex-row">
                    <a class="nav-link mx-2" href="index.html">Home</a>
                    <a class="nav-link mx-2 active" href="explore.html">Explore Adventures</a>
                    <a class="nav-link mx-2" href="booking.html">Book a Tour</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- CONTENT DISPLAY CONTAINER -->
    <main class="container my-5">
        <header class="text-center mb-5">
            <h1 class="display-5 fw-bold">Choose Your Adventure</h1>
            <p class="text-muted">Filter smoothly through our hand-picked Jamaican excursions below.</p>
        </header>

        <!-- BOOTSTRAP BUTTON GROUP INTERFACE ELEMENTS -->
        <section class="d-flex justify-content-center gap-2 mb-5">
            <button class="btn btn-outline-success active filter-btn" data-category="all">Show All</button>
            <button class="btn btn-outline-success filter-btn" data-category="Water">Waterfalls & Rivers</button>
            <button class="btn btn-outline-success filter-btn" data-category="Mountain">Hiking & Mountains</button>
            <button class="btn btn-outline-success filter-btn" data-category="Beach">Pristine Beaches</button>
        </section>

        <!-- BOOTSTRAP RESPONSIVE ROW GRID CONTAINER POPULATED DYNAMICALLY BY SCRIPT -->
        <section class="row g-4" id="adventure-container">
            <div class="col-12 text-center text-muted py-5">
                <p>Loading epic Jamaican adventures...</p>
            </div>
        </section>
    </main>

    <!-- FOOTER STRUCTURE -->
    <footer class="bg-dark text-white text-center py-4 mt-5">
        <div class="container">
            <p class="mb-0">&copy; 2026 Jamaica Adventure Hub. All Rights Reserved.</p>
        </div>
    </footer>

    <!-- Core Javascript Code -->
    <script src="js/app.js"></script>
</body>
</html>
