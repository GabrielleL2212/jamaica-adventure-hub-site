<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jamaica Adventure Hub | Explore</title>
    <!-- Link directly to our own custom layout rules sheet -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- CUSTOM OFFLINE NAVIGATION BAR -->
    <nav class="navbar-custom">
        <a class="navbar-brand-custom" href="index.html">🇯🇲 Jamaica Adventure Hub</a>
        <div class="nav-links-custom">
            <a href="index.html">Home</a>
            <a href="explore.html" class="active">Explore Adventures</a>
            <a href="booking.html">Book a Tour</a>
        </div>
    </nav>

    <!-- CONTENT DISPLAY WORKFLOW -->
    <main class="main-container">
        <header class="text-center">
            <h1 style="font-size: 36px; margin-bottom: 10px;">Choose Your Adventure</h1>
            <p style="color: #666;">Filter smoothly through our hand-picked Jamaican excursions below.</p>
        </header>

        <!-- STUDENT ELEMENT FILTERS -->
        <section class="button-group">
            <button class="btn-custom active filter-btn" data-category="all">Show All</button>
            <button class="btn-custom filter-btn" data-category="Water">Waterfalls & Rivers</button>
            <button class="btn-custom filter-btn" data-category="Mountain">Hiking & Mountains</button>
            <button class="btn-custom filter-btn" data-category="Beach">Pristine Beaches</button>
        </section>

        <!-- CONTAINER POPULATED DYNAMICALLY BY JAVASCRIPT OBJECT DATA -->
        <section class="adventure-grid" id="adventure-container">
            <p class="text-center" style="grid-column: 1/-1; color: #888;">Loading epic Jamaican adventures...</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Jamaica Adventure Hub. All Rights Reserved.</p>
    </footer>

    <!-- Custom Beginner JavaScript Loop File -->
    <script src="js/app.js"></script>
</body>
</html>
