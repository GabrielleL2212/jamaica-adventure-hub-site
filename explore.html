<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jamaica Adventure Hub | Explore</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- NAVIGATION BAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">🇯🇲 Jamaica Adventure Hub</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="explore.html">Explore Adventures</a></li>
                    <li class="nav-item"><a class="nav-link" href="booking.html">Book a Tour</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- MAIN LOGIC CONTAINER -->
    <main class="container my-5">
        <header class="text-center mb-5">
            <h1 class="display-5 fw-bold">Choose Your Adventure</h1>
            <p class="text-muted">Filter through our hand-picked Jamaican excursions below.</p>
        </header>

        <!-- ⚡ INTERACTIVE FILTER BUTTONS -->
        <section class="row mb-4">
            <div class="col-12 text-center" id="filter-buttons">
                <button class="btn btn-outline-primary active me-2 filter-btn" data-category="all">Show All</button>
                <button class="btn btn-outline-primary me-2 filter-btn" data-category="water">Waterfalls & Rivers</button>
                <button class="btn btn-outline-primary me-2 filter-btn" data-category="mountain">Hiking & Mountains</button>
                <button class="btn btn-outline-primary filter-btn" data-category="beach">Pristine Beaches</button>
            </div>
        </section>

        <!-- ⚡ DYNAMIC CARDS CONTAINER -->
        <!-- JavaScript will automatically inject our adventure cards right inside this row element -->
        <section class="row g-4" id="adventure-container">
            <div class="col-12 text-center text-muted py-5">
                <p>Loading epic Jamaican adventures...</p>
            </div>
        </section>
    </main>

    <!-- FOOTER -->
    <footer class="bg-dark text-white text-center py-4 mt-5">
        <div class="container">
            <p class="mb-0">&copy; 2026 Jamaica Adventure Hub. All Rights Reserved.</p>
        </div>
    </footer>

    <!-- jQuery and Bootstrap Script Assets -->
    <script src="https://jquery.com"></script>
    <script src="https://jsdelivr.net"></script>
    <!-- Custom JavaScript Workflow -->
    <script src="js/app.js"></script>
</body>
</html>
